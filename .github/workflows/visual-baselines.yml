# One-off workflow to seed Playwright visual-regression baselines.
#
# Why this exists: visual baselines are OS- + font-rendering-dependent.
# The chopnow-app CI runs on Ubuntu, so baselines generated on macOS
# (the founder's dev box) won't match. This workflow generates them
# on the same Ubuntu image the regular CI uses, commits the resulting
# PNGs back to the branch it was dispatched on, and is then archived.
#
# Triggers:
#   - push to chore/seed-visual-baselines (auto-runs when this branch
#     lands so the bootstrap is "push the branch, walk away")
#   - workflow_dispatch (manual re-seed: pick any branch in the GH UI
#     and click Run — useful if a design change later invalidates
#     baselines and we want a clean re-roll without local Playwright)
name: Visual baselines (seed)

on:
  workflow_dispatch:
  push:
    branches:
      - chore/seed-visual-baselines

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skip when the triggering commit was made by this workflow itself
    # — otherwise the auto-commit at the end would re-trigger us, and
    # we'd loop forever pushing the same PNGs. Real user-driven pushes
    # to this branch don't have this prefix, so they still seed.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the GH-actions token so the resulting commit can push
          # back to this same branch (default token has `contents:write`
          # under the permissions block above).
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # First run: --update-snapshots generates the baselines for any
      # spec that doesn't have one. Suppressing the exit code because
      # Playwright still returns non-zero when it CREATED baselines
      # (treats "no baseline existed" as a test failure pre-creation).
      - name: Generate baselines
        run: npm run test:e2e:update-snapshots || true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          CI: 'true'

      # Verify the baselines were actually created — if Playwright
      # silently failed (e.g. the dev server didn't boot), we don't
      # want to commit nothing and "succeed".
      - name: Verify baselines exist
        run: |
          set -e
          if ! ls e2e/visual.spec.ts-snapshots/*.png >/dev/null 2>&1; then
            echo "::error::No baseline PNGs produced. Inspect Playwright output above."
            exit 1
          fi
          echo "Generated baselines:"
          ls -la e2e/visual.spec.ts-snapshots/

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore(e2e): seed visual-regression baselines

          Generated by .github/workflows/visual-baselines.yml on the
          Ubuntu runner so they match the same image regular CI uses.
          Re-trigger via workflow_dispatch + --update-snapshots if a
          design change invalidates these later.

          (This workflow's job-level if-guard skips re-runs triggered
          by this bot's own pushes — see visual-baselines.yml jobs.seed.if.
          The main CI WILL re-run on this commit to validate the new
          baselines against itself; that's intentional.)"
          git push origin HEAD:${{ github.ref_name }}
