# CI — Gate 1 (feature → develop) and required check for develop → main releases.
#
# Runs on:
#   - Every push to a feature branch (fast feedback during local iteration —
#     dev sees lint/type/test result before even opening a PR)
#   - Every PR to develop / main (the merge gate)
#
# Pushes to develop / main are EXCLUDED — those branches only ever
# receive merge commits from PRs that already ran this workflow, so
# re-running would burn minutes for zero new signal.

name: CI

on:
  workflow_dispatch:
  push:
    branches-ignore: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 runtime for JavaScript actions BEFORE the June 2nd
# 2026 default flip. Removes the "Node.js 20 actions are deprecated"
# warnings from every run. Same pattern as chopnow-api.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # --- Required (block merge) ---
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      # --- Blocking: matches chopnow-api's gate. ---
      # If a HIGH or CRITICAL CVE lands in the dependency tree, the PR
      # cannot merge until either the vulnerable dep is updated or the
      # CVE is reviewed + acknowledged via `npm audit fix` or an
      # exception. Dependabot opens auto-fix PRs for routine updates;
      # this gate is the safety net for the moments it doesn't.
      - name: Security audit (deps)
        run: npm audit --audit-level=high

      # --- Warning only (informational, never blocks merge) ---
      - name: i18n hardcoded-string check (warning only)
        if: contains(github.event.pull_request.changed_files, 'features/') || contains(github.event.pull_request.changed_files, 'app/')
        run: |
          echo "::warning::Reminder: user-facing strings should go through next-intl (messages/fr.json + messages/en.json)."
