<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#E11D2A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Hors-ligne — TChopNow</title>
    <!--
      Served by the service worker when a navigation request fails offline
      and no cached match is available. Inline everything — by definition
      this page renders with no network, so it cannot reach Google Fonts,
      the JS bundle, or icon-*.png from /icons/. Inline SVG logo +
      system-font stack keep it readable even on the oldest fleet phones.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fafaf7;
        color: #0f0f0f;
        font-family:
          'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        gap: 24px;
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: #e11d2a;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;
        font-size: 36px;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        max-width: 18ch;
      }
      p {
        margin: 0;
        font-size: 16px;
        color: #525252;
        max-width: 28ch;
        line-height: 1.4;
      }
      button {
        appearance: none;
        border: 0;
        background: #e11d2a;
        color: white;
        font: inherit;
        font-weight: 600;
        font-size: 16px;
        padding: 14px 28px;
        border-radius: 999px;
        min-height: 48px;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        font-size: 13px;
        color: #898989;
        margin-top: 8px;
      }
      /* iOS dark-mode users see the dark scheme — but our brand is light. */
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">T</div>
      <h1>Tu es hors-ligne</h1>
      <p>
        Vérifie ta connexion internet, puis réessaie pour commander.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
      <span class="hint">TChopNow — Mange sans attendre</span>
    </main>
  </body>
</html>
